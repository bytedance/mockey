version: "2"
linters:
  disable:
    - errcheck
    - staticcheck
  settings:
    govet:
      disable:
        - stdmethods
        # Inline modernization suggestions can require APIs newer than Go 1.13.
        - inline
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      - third_party$
      - builtin$
      - examples$
      - ".*\\.mock\\.go$"
formatters:
  enable:
    - gofmt
    - gofumpt
  settings:
    gofumpt:
      extra:
        group-params: true
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
      - ".*\\.mock\\.go$"
